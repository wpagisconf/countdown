<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcGIS Dashboard Countdown Timer</title>
    <style>
        /* Base reset for ArcGIS Dashboard embedded widget compatibility */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent; /* Seamless blend with dashboard theme */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Widget Container */
        .widget-container {
            width: 100%;
            height: 100%;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(23, 27, 34, 0.85); /* Modern ArcGIS Dark theme background */
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Header Title */
        .title {
            font-size: clamp(0.9rem, 2.5vw, 1.25rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #00b0ff; /* ArcGIS Accent Cyan */
            margin-bottom: 1.2rem;
            text-align: center;
        }

        /* Countdown Grid Layout */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.75rem;
            width: 100%;
            max-width: 500px;
        }

        /* Individual Time Card */
        .time-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 0.75rem 0.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .time-card:hover {
            border-color: rgba(0, 176, 255, 0.4);
            transform: translateY(-1px);
        }

        /* Number Display */
        .number {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 700;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        /* Unit Label */
        .label {
            font-size: clamp(0.6rem, 1.5vw, 0.75rem);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9e9e9e;
            margin-top: 0.35rem;
        }

        /* Expiration State */
        .expired-message {
            display: none;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 600;
            color: #00e676;
            text-align: center;
            padding: 1rem;
        }

        /* Responsive tweak for very small height panels */
        @media (max-height: 180px) {
            .title {
                margin-bottom: 0.5rem;
            }
            .time-card {
                padding: 0.4rem 0.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="title" id="widget-title">Countdown to October 22, 2026</div>

        <div id="countdown-grid" class="countdown-grid">
            <div class="time-card">
                <span id="days" class="number">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-card">
                <span id="hours" class="number">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-card">
                <span id="minutes" class="number">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-card">
                <span id="seconds" class="number">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div id="expired-message" class="expired-message">
            Target Date Reached! 🎉
        </div>
    </div>

    <script>
        // Target Date: October 22, 2026 00:00:00 UTC
        const targetDate = new Date("2026-10-22T00:00:00").getTime();

        // Cached DOM elements
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const gridEl = document.getElementById("countdown-grid");
        const expiredEl = document.getElementById("expired-message");

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                // Timer reached zero
                gridEl.style.display = "none";
                expiredEl.style.display = "block";
                clearInterval(timerInterval);
                return;
            }

            // Calculation logic
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Fast DOM updates with padding
            daysEl.textContent = String(days).padStart(2, "0");
            hoursEl.textContent = String(hours).padStart(2, "0");
            minutesEl.textContent = String(minutes).padStart(2, "0");
            secondsEl.textContent = String(seconds).padStart(2, "0");
        }

        // Run immediately on render
        updateCountdown();

        // Continuous tick interval (1000ms)
        const timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
